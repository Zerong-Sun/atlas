name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  # Atlas is validated independently in atlas.yml.

  validate-fatequest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fatequest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # NOTE: the web-version gates (scripts/validate-outcomes.mjs,
      # smoke-outcomes.mjs) were removed 2026-07. The HTML/JS game they tested
      # is archived under fatequest/archive/web-version/; the Godot version is
      # the live game. Restore from git history if the web version is revived.
      # Content gates G1/G2/G3/G8/G10/G12 — docs/DATA_MODEL.md §9
      # Story text must be compiled from its authoring format, and no
      # translation may be older than the source it was made from.
      - run: node tools/lore/story.mjs check
      - run: node tools/validate/validate.mjs
      # Rng parity: the GDScript port must reproduce Atlas seed.ts bit-for-bit
      - run: node tools/parity/gen_rng_fixture.mjs && git diff --exit-code tools/parity/rng_fixture.json

  # Kernel tests run in real Godot. Without this the .gd files are only ever
  # checked by hand, and "the JSON validates" says nothing about whether the
  # engine can parse the scripts.
  godot-tests:
    runs-on: ubuntu-latest
    # A hung headless test once spun for six hours before GitHub's default
    # timeout killed it. Fail in fifteen minutes instead; the whole suite
    # normally finishes in well under one.
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (headless)
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version
      - name: Import project
        working-directory: fatequest
        run: godot --headless --import
      - name: Run kernel test suite
        working-directory: fatequest
        run: godot --headless --script tests/run_tests.gd
      - name: Boot smoke (real main scene)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_boot.gd
      - name: Play smoke (drive the UI)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_play.gd
      - name: Zayton vertical slice
        working-directory: fatequest
        run: godot --headless --script tests/smoke_zayton.gd
      - name: Market smoke (buy through the UI)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_market.gd
      - name: City navigation (no dead ends)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_citynav.gd
      - name: Codex browser
        working-directory: fatequest
        run: godot --headless --script tests/smoke_codex.gd
      - name: Save / load round trip
        working-directory: fatequest
        run: godot --headless --script tests/smoke_save.gd
      - name: Retainers (hire through the UI, cargo linkage §11.7)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_party.gd
      - name: Endings (close the book, epilogue on screen)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_ending.gd
      - name: Battuta corpus (entry + site events, raw-key guard)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_battuta.gd
      - name: Fresh-install hospitality, market and departure
        working-directory: fatequest
        run: python3 tools/validate/playtest_local.py tests/smoke_welcome_journey.gd
      - name: UI interaction, portraits and responsive layout regressions
        working-directory: fatequest
        run: >-
          python3 tools/validate/playtest_local.py
          tests/smoke_button_motion.gd
          tests/smoke_portrait_mapping.gd
          tests/smoke_hire_contract.gd
          tests/smoke_dialog_usability.gd
          tests/smoke_city_market_usability.gd
          tests/smoke_city_market_boundaries.gd
          tests/smoke_character_draw.gd
          tests/smoke_review_edges.gd
          tests/smoke_city_card_entry.gd
      - name: Story result continuation and lesson boundaries
        working-directory: fatequest
        run: >-
          python3 tools/validate/playtest_local.py
          tests/smoke_balc_followup.gd
          tests/smoke_baldacum_mentor.gd
          tests/smoke_zayton_mentor.gd
          tests/smoke_tauris_merchant.gd
          tests/smoke_road_followup.gd
          tests/smoke_tauris_mentor.gd
      - name: Upload UI playtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatequest-ui-playtest-logs
          path: fatequest/build/playtest/*.log
          if-no-files-found: ignore
      - name: Curated reading-card source anchors
        working-directory: fatequest
        run: |
          python3 tools/lore/audit_reading_cards.py
          python3 tests/test_reading_cards_audit.py
      - name: Zayton battuta content contract (GDLC ratchet)
        working-directory: fatequest
        run: godot --headless --script tests/audit_zayton_battuta.gd
      - name: Logic & boundary audit
        working-directory: fatequest
        run: godot --headless --script tests/audit_logic.gd
      - name: Divination readings audit
        working-directory: fatequest
        run: godot --headless --script tests/audit_divination_readings.gd
      - name: Economy sell-gate contract (GDLC ratchet)
        working-directory: fatequest
        run: godot --headless --script tests/audit_economy_sellgate.gd
      - name: Market trade order (GDLC ratchet)
        working-directory: fatequest
        run: godot --headless --script tests/audit_market_trades.gd
