name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  # NOTE: the validate-atlas job is intentionally removed (2026-07). Atlas is
  # frozen — front end, back end and Vercel deploys are all paused, and it is
  # kept under atlas/ for reference only (docs/ATLAS_PORT.md). Restore this job
  # from git history if Atlas is ever unfrozen.

  validate-fatequest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fatequest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-outcomes.mjs
      - run: node scripts/smoke-outcomes.mjs
      # Content gates G1/G2/G3/G8/G10/G12 — docs/DATA_MODEL.md §9
      - run: node tools/validate/validate.mjs
      # Rng parity: the GDScript port must reproduce Atlas seed.ts bit-for-bit
      - run: node tools/parity/gen_rng_fixture.mjs && git diff --exit-code tools/parity/rng_fixture.json

  # Kernel tests run in real Godot. Without this the .gd files are only ever
  # checked by hand, and "the JSON validates" says nothing about whether the
  # engine can parse the scripts.
  godot-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (headless)
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version
      - name: Import project
        working-directory: fatequest
        run: godot --headless --import
      - name: Run kernel test suite
        working-directory: fatequest
        run: godot --headless --script tests/run_tests.gd
      - name: Boot smoke (real main scene)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_boot.gd
      - name: Play smoke (drive the UI)
        working-directory: fatequest
        run: godot --headless --script tests/smoke_play.gd
      - name: Zayton vertical slice
        working-directory: fatequest
        run: godot --headless --script tests/smoke_zayton.gd
