name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate-atlas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run corpus:generate
      - run: npm run corpus:validate
      - run: npm run lint -w @atlas/web
      - run: npm run build -w @atlas/web
      - run: npm run test -w @atlas/web
      - run: npm run test -w @atlas/engines
      - run: npm run test -w @atlas/orchestrator
      - run: npm run corpus:ingest:dry-run
      - run: npm run corpus:embed:dry-run
      - run: npm run test -w @atlas/api-core

  validate-fatequest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fatequest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-outcomes.mjs
      - run: node scripts/smoke-outcomes.mjs
      # Content gates G1/G2/G3/G8/G10/G12 — docs/DATA_MODEL.md §9
      - run: node tools/validate/validate.mjs
      # Rng parity: the GDScript port must reproduce Atlas seed.ts bit-for-bit
      - run: node tools/parity/gen_rng_fixture.mjs && git diff --exit-code tools/parity/rng_fixture.json
